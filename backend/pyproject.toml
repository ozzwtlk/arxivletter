[project]
name = "arxivletter"
version = "0.1.0"
description = "arXivletter: research digest of every new hep-ph / hep-th paper, with author-stated open problems and AI-inferred research gaps"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pymupdf>=1.26",
  "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[project.scripts]
arxivletter = "arxivletter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arxivletter"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "E731", "B904"]
